<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin · Motos de ocasión | AMR MotorBike</title>
    <!-- Pàgina privada: que no surti als cercadors -->
    <meta name="robots" content="noindex, nofollow">

    <style>
        /* ============================================================
           ADMIN.CSS (intern) — AMR MotorBike
           Còpia de la secció d'ocasió i del modal de estils.css.
           Mobile-first: base = mòbil, un sol breakpoint (768px).
           ============================================================ */

        /* ─── FONT ─────────────────────────────────────────────── */
        @font-face {
            font-family: 'airstrike';
            src: url('https://avsets.pages.dev/fonts/airstrike.ttf') format('truetype');
            font-weight: 700;
            font-style: normal;
        }
        @font-face {
            font-family: 'airstrikebullet';
            src: url('https://avsets.pages.dev/fonts/airstrikebullet.ttf') format('truetype');
            font-weight: 700;
            font-style: normal;
        }

        /* ─── VARIABLES (aquí es canvien colors i fonts de l'admin) ─ */
        :root {
            --negre:         #0f0f0f;
            --negre-suau:    #1a1a1a;
            --taronja:       #f97316;
            --taronja-fosc:  #c2560f;
            --gris:          #a0a0a0;
            --gris-clar:     #d4d4d4;
            --blanc:         #ffffff;
            --vermell:       #e53012;
            --reservada:     #e67e22;
            --verd:          #25D366;

            --font-titol:    'airstrikebullet', sans-serif;
            --font-titol2:   'airstrike', sans-serif;
            --font-cos:      'Segoe UI', Roboto, sans-serif;

            --radi:          8px;
        }

        /* ─── RESET ────────────────────────────────────────────── */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html {
            background-color: var(--negre);
            min-height: 100%;
        }

        body {
            font-family: var(--font-cos);
            color: var(--blanc);
            margin: 0 auto;
        }

        img { max-width: 100%; display: block; }

        /* ─── SECCIÓ (idèntica a la de la web, amb una mica menys d'espai) ─ */
        .seccio {
            padding: 32px 24px;
            @media (min-width: 768px) {
                padding: 48px 40px;
            }
            @media (min-width: 1024px) {
                max-width: 1100px;
                margin: 0 auto;
            }
        }

        .seccio-titol {
            font-family: var(--font-titol);
            font-size: 1.9rem;
            color: var(--blanc);
            line-height: 1.2;
            margin-bottom: 20px;
        }

        /* Missatge d'estat de la pàgina (errors de càrrega, llista buida) */
        .admin-estat {
            font-size: 0.95rem;
            color: var(--gris);
        }

        /* ─── GRAELLA I TARGETES ───────────────────────────────── */
        .serveis-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-top: 32px;
            @media (min-width: 768px) {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .servei-card {
            position: relative;
            overflow: hidden;
            cursor: pointer;
            background: linear-gradient(135deg, rgb(20 40 114) 0%, rgba(20 40 114 / 0.05) 100%);
            border: 1px solid rgba(255 255 255 / 0.3);
            border-left: 3px solid var(--taronja);
            padding: 20px 18px;
            border-radius: var(--radi);
            transition: border-color 0.2s, background 0.2s;
        }
        .servei-card:hover {
            background: rgba(249,115,22,0.07);
            border-left-color: var(--taronja-fosc);
        }

        .servei-ico { margin-bottom: 10px; }
        .servei-ico img {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
        }

        .servei-titol {
            font-family: var(--font-titol2);
            font-size: 0.95rem;
            color: var(--blanc);
            margin-bottom: 8px;
        }
        .servei-titol--plus {
            font-size: 1.5rem;
            color: var(--taronja);
        }

        .servei-desc {
            font-size: 13px;
            color: var(--gris-clar);
            line-height: 1.6;
        }

        /* Banner diagonal de la targeta (VENDIDA / RESERVADA) */
        .servei-card-banner {
            position: absolute;
            top: 25px;
            right: -42px;
            width: 170px;
            transform: rotate(45deg);
            background: #e60000;
            color: #ffffff;
            text-align: center;
            padding: 5px 0;
            z-index: 5;
            box-shadow: 0 2px 6px rgba(0,0,0,0.25);
            display: flex;
            flex-direction: column;
            line-height: 1.3;
        }
        .servei-card-banner .banner-linia1 {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        /* ─── MODAL FITXA MOTO ─────────────────────────────────── */
        /* Fons fosc que cobreix tota la pantalla */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }

        /* Contenidor principal del modal */
        .modal-container {
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            background: #181818;
            color: var(--blanc);
            padding: 24px;
            border-radius: var(--radi);
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            @media (min-width: 768px) {
                width: 75vw;
                max-width: 900px;
            }
        }

        /* Botó tancar (X) */
        .modal-btn-tancar {
            position: absolute;
            top: 15px;
            right: 20px;
            background: none;
            border: none;
            color: var(--taronja);
            font-size: 24px;
            cursor: pointer;
            z-index: 2;
        }

        /* Fletxes de navegació entre motos */
        .modal-fletxa {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            font-size: 20px;
            padding: 10px 14px;
            cursor: pointer;
            border-radius: 50%;
            z-index: 2;
            transition: background 0.2s;
        }
        .modal-fletxa:hover { background: var(--taronja); }
        .fletxa-esq   { left: 10px; }
        .fletxa-dreta { right: 10px; }

        /* Capçalera: ID + Marca + Modelo (editables) */
        .modal-capcalera {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            padding-right: 36px; /* espai per a la X */
            margin-bottom: 15px;
            @media (min-width: 768px) {
                grid-template-columns: 110px 1fr 1fr;
            }
        }

        /* Foto principal (el contenidor és relatiu perquè el banner s'hi posiciona a sobre) */
        .modal-foto-principal {
            position: relative;
            overflow: hidden;
        }
        #modal-img-gran {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: contain;
            background-color: #111111;
            border-radius: var(--radi);
        }

        /* Banner diagonal del modal */
        .modal-banner {
            position: absolute;
            top: 25px;
            right: -32px;
            width: 170px;
            transform: rotate(45deg);
            background: #e60000;
            color: #ffffff;
            text-align: center;
            padding: 7px 0;
            z-index: 5;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }
        .modal-banner .banner-linia1 {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Reixeta de les 5 miniatures */
        .modal-miniatures-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin: 12px 0;
        }
        .modal-miniatures-grid img {
            width: 100%;
            height: 60px;
            object-fit: cover;
            border-radius: 4px;
            cursor: pointer;
            opacity: 0.5;
            transition: opacity 0.2s, border-color 0.2s;
            border: 2px solid transparent;
        }
        .modal-miniatures-grid img.activa,
        .modal-miniatures-grid img:hover {
            opacity: 1;
            border-color: var(--taronja);
        }

        /* Dades tècniques (ara amb camps editables) */
        .modal-specs-wrapper { position: relative; min-height: 48px; }
        .modal-specs-wrapper .modal-specs-grid { padding-left: 46px; padding-right: 46px; }
        .modal-specs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: var(--radi);
            margin: 15px 0;
            text-align: center;
        }
        .spec-label {
            display: block;
            color: #aaa;
            font-size: 0.85rem;
            margin-bottom: 4px;
        }

        /* Camps de text editables (inputs i textarea) */
        .camp {
            width: 100%;
            padding: 8px 10px;
            background: #0d0d1a;
            border: 1px solid #444;
            border-radius: 4px;
            color: var(--blanc);
            font-family: var(--font-cos);
            font-size: 1rem;
            outline: none;
            &:focus { border-color: var(--taronja); }
            &[readonly] { color: var(--gris); }
            /* Camp modificat i pendent de guardar (va després de :focus perquè hi guanyi) */
            &.camp--canviat { border-color: var(--vermell); }
        }
        .camp--spec {
            text-align: center;
            font-weight: bold;
            color: var(--taronja);
        }
        .camp--titol {
            font-family: var(--font-titol2);
            font-size: 1.1rem;
        }
        textarea.camp {
            min-height: 90px;
            line-height: 1.4;
            resize: vertical;
            margin-bottom: 16px;
        }

        /* Els 3 estats: En venta / Reservada / Vendida (només un marcat) */
        .modal-estats {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }
        .estat-opcio {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px;
            border: 1px solid #444;
            border-radius: var(--radi);
            cursor: pointer;
            font-size: 0.95rem;
            &:has(input:checked) {
                border-color: var(--taronja);
                background: rgba(249,115,22,0.12);
            }
        }

        /* Estat modificat i pendent de guardar: l'opció marcada es veu en vermell */
        .modal-estats--canviat .estat-opcio:has(input:checked) {
            border-color: var(--vermell);
            background: rgba(229, 48, 18, 0.12);
        }

        /* Botons d'acció: nova moto i guardar */
        .modal-accions {
            display: flex;
            gap: 12px;
        }
        .btn-contacte {
            flex: 1;
            text-align: center;
            padding: 12px;
            border: none;
            border-radius: var(--radi);
            font-family: var(--font-cos);
            font-size: 1rem;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
            transition: opacity 0.2s;
            &:hover { opacity: 0.9; }
            &:disabled { opacity: 0.35; cursor: not-allowed; }
        }
        .btn-nova    { background: var(--verd); }
        .btn-guardar { background: var(--taronja); }
        /* Hi ha camps pendents de guardar */
        .btn-guardar--pendent { background: var(--vermell); }

        /* Botó eliminar moto (demana confirmació amb un segon clic) */
        .btn-eliminar {
            width: 100%;
            margin-top: 14px;
            padding: 10px;
            background: none;
            border: 1px solid #555;
            border-radius: var(--radi);
            color: var(--gris);
            font-family: var(--font-cos);
            font-size: 0.9rem;
            cursor: pointer;
        }
        .btn-eliminar--confirmar {
            background: var(--vermell);
            border-color: var(--vermell);
            color: var(--blanc);
            font-weight: bold;
        }

        /* Missatge d'estat sota els botons */
        .modal-missatge {
            min-height: 18px;
            margin-top: 10px;
            font-size: 0.85rem;
            color: var(--gris);
            text-align: center;
        }
    </style>
</head>

<body>

    <!-- SECCIÓ OCASIÓ (graella de targetes) -->
    <main class="seccio" id="ocasion">
        <h2 class="seccio-titol">Motos de ocasión</h2>
        <p id="admin-estat" class="admin-estat"></p>
        <div class="serveis-grid" id="admin-graella"></div>
    </main>

    <!-- MODAL FITXA MOTO (camps editables) -->
    <div id="modal-moto" class="modal-overlay" style="display: none;">
        <div class="modal-container">

            <!-- Botó tancar -->
            <button class="modal-btn-tancar" onclick="tancarModalMoto()"><strong>✕</strong></button>

            <!-- Capçalera: ID (només lectura), Marca i Modelo -->
            <div class="modal-capcalera">
                <input id="camp-id"     class="camp camp--titol" type="text" readonly aria-label="ID">
                <input id="camp-marca"  class="camp camp--titol" type="text" placeholder="Marca"  aria-label="Marca">
                <input id="camp-model"  class="camp camp--titol" type="text" placeholder="Modelo" aria-label="Modelo">
            </div>

            <!-- Foto principal + banner -->
            <div class="modal-foto-principal" id="modal-foto-principal">
                <img id="modal-img-gran" src="" alt="Foto principal">
            </div>

            <!-- Les 5 fotos -->
            <div id="modal-miniatures" class="modal-miniatures-grid"></div>

            <!-- Dades tècniques editables, amb fletxes per canviar de moto -->
            <div class="modal-specs-wrapper">
                <button class="modal-fletxa fletxa-esq" onclick="canviarMoto(-1)">❮</button>
                <div class="modal-specs-grid">
                    <div class="spec-item"><label class="spec-label" for="camp-preu">Precio</label>
                        <input id="camp-preu" class="camp camp--spec" type="text" inputmode="decimal"></div>
                    <div class="spec-item"><label class="spec-label" for="camp-cc">Cilindrada (cc)</label>
                        <input id="camp-cc"   class="camp camp--spec" type="text" inputmode="numeric"></div>
                    <div class="spec-item"><label class="spec-label" for="camp-kw">Potencia (cv/kW)</label>
                        <input id="camp-kw"   class="camp camp--spec" type="text" inputmode="numeric"></div>
                    <div class="spec-item"><label class="spec-label" for="camp-any">Año</label>
                        <input id="camp-any"  class="camp camp--spec" type="text" inputmode="numeric"></div>
                    <div class="spec-item"><label class="spec-label" for="camp-km">Kilómetros</label>
                        <input id="camp-km"   class="camp camp--spec" type="text" inputmode="numeric"></div>
                </div>
                <button class="modal-fletxa fletxa-dreta" onclick="canviarMoto(1)">❯</button>
            </div>

            <!-- Descripció -->
            <textarea id="camp-descripcio" class="camp" placeholder="Descripción / extras" aria-label="Descripción"></textarea>

            <!-- Estat de la moto: només un marcat -->
            <div class="modal-estats">
                <label class="estat-opcio"><input type="radio" name="estat" value="venda"     checked> En venta</label>
                <label class="estat-opcio"><input type="radio" name="estat" value="reservada"> Reservada</label>
                <label class="estat-opcio"><input type="radio" name="estat" value="venuda">    Vendida</label>
            </div>

            <!-- Botons: afegir moto nova i guardar (només si hi ha canvis) -->
            <div class="modal-accions">
                <button id="btn-nova"    class="btn-contacte btn-nova"    type="button">＋ Nueva moto</button>
                <button id="btn-guardar" class="btn-contacte btn-guardar" type="button" disabled>Guardar</button>
            </div>
            <p id="modal-missatge" class="modal-missatge"></p>

            <!-- Eliminar la moto oberta (la seva ID no es reutilitza mai) -->
            <button id="btn-eliminar" class="btn-eliminar" type="button">Eliminar moto</button>

        </div>
    </div>

    <!-- Configuració (BASE_WORKER, ASSETS_OCA...) -->
    <script src="config.js"></script>
    <!-- Modal de login: surt si s'arriba aquí sense haver entrat -->
    <script src="login.js"></script>

    <script>
        /* ============================================================
           ADMIN — lògica de la pàgina (graella, modal, canvis)
           Les motos es llegeixen del Worker (KV) i Guardar les hi envia
           amb la clau d'admin. PENDENT: contador d'ID i fotos.
           ============================================================ */

        // Clau d'admin que ha desat login.js en entrar (buida si no s'ha passat pel login)
        const clauAdmin = sessionStorage.getItem('admin_clau');

        // Còpia de treball de les motos (sense la targeta fixa id9999)
        let motos = [];
        // La targeta fixa "vender mi moto": es conserva tal qual, sempre al final
        let targetaFixa = null;
        // Còpia de cada moto tal com està guardada (clau = id), per saber què s'ha tocat
        let originals = {};
        // IDs de les motos que ja estaven guardades en carregar la pàgina
        let motosGuardades = new Set();
        // IDs de motos guardades que s'han eliminat i encara no s'ha desat el canvi
        let eliminades = [];
        // Últim número d'ID usat: només puja, mai baixa (les IDs eliminades no es reutilitzen)
        let contadorId = 0;
        // Índex de la moto oberta al modal
        let motoActualIndex = 0;

        /* ─── CÀRREGA DE DADES ─────────────────────────────────── */
        async function carregarMotos() {
            // Llegeix l'array del Worker (KV); si falla, el try de l'inici mostra l'error
            const res = await fetch(`${CONFIG.BASE_WORKER}/`, { cache: 'no-store' });
            if (!res.ok) throw new Error('Worker ' + res.status);
            const dades = await res.json();
            if (!Array.isArray(dades)) throw new Error('Format incorrecte');

            motos = dades.filter(m => !m.titol);
            targetaFixa = dades.find(m => m.titol) || null;
            originals = {};
            motos.forEach(m => { originals[m.id] = JSON.parse(JSON.stringify(m)); });
            motosGuardades = new Set(motos.map(m => m.id));
            eliminades = [];
            // El contador parteix de l'ID més alta existent (PENDENT: llegir-lo del KV)
            contadorId = motos.reduce((m, moto) => Math.max(m, parseInt(moto.id.replace('id', ''), 10) || 0), 0);
        }

        /* ─── GRAELLA DE TARGETES ──────────────────────────────── */
        // Banner segons l'estat de la moto (venuda té prioritat sobre reservada)
        function bannerTargeta(moto) {
            if (moto.venuda)    return '<div class="servei-card-banner"><span class="banner-linia1">VENDIDA</span></div>';
            if (moto.reservada) return '<div class="servei-card-banner" style="background-color: var(--reservada);"><span class="banner-linia1">RESERVADA</span></div>';
            return '';
        }

        function pintarGraella() {
            document.getElementById('admin-graella').innerHTML = motos.map((s, idx) => `
                <div class="servei-card" data-id="${s.id}" onclick="obrirModalMoto(${idx})">
                    ${bannerTargeta(s)}
                    <div class="servei-ico"><img src="${CONFIG.ASSETS_OCA}${s.fotos[0]}" alt="${s.marca} ${s.model}"></div>
                    <div class="servei-titol">${s.marca} ${s.model}</div>
                    <div class="servei-titol servei-titol--plus">${s.preu} </div>
                    <div class="servei-desc">Matriculación: <strong>${s.any}</strong></div>
                    <div class="servei-desc">Kilometros: <strong>${s.km}</strong></div>
                </div>
            `).join('');
        }

        /* ─── MODAL: OBRIR, TANCAR, NAVEGAR ────────────────────── */
        function obrirModalMoto(index) {
            motoActualIndex = index;
            carregarDadesModal();
            document.getElementById('modal-moto').style.display = 'flex';
        }

        function tancarModalMoto() {
            document.getElementById('modal-moto').style.display = 'none';
            pintarGraella(); // la graella reflecteix els canvis fets al modal
        }

        function canviarMoto(direccio) {
            motoActualIndex += direccio;
            if (motoActualIndex < 0) motoActualIndex = motos.length - 1;
            else if (motoActualIndex >= motos.length) motoActualIndex = 0;
            carregarDadesModal();
        }

        /* ─── MODAL: OMPLIR ELS CAMPS ──────────────────────────── */
        // Camps de text: id de l'input → propietat de la moto
        const CAMPS = {
            'camp-marca':      'marca',
            'camp-model':      'model',
            'camp-preu':       'preu',
            'camp-cc':         'cc',
            'camp-kw':         'kw',
            'camp-any':        'any',
            'camp-km':         'km',
            'camp-descripcio': 'descripcio'
        };

        // Banner del modal segons l'estat (es refà cada cop que canvia l'estat)
        function pintarBannerModal() {
            const moto = motos[motoActualIndex];
            const contenidor = document.getElementById('modal-foto-principal');
            const anterior = contenidor.querySelector('.modal-banner');
            if (anterior) anterior.remove();

            if (moto.venuda) {
                contenidor.insertAdjacentHTML('beforeend',
                    '<div class="modal-banner"><span class="banner-linia1">VENDIDA</span></div>');
            } else if (moto.reservada) {
                contenidor.insertAdjacentHTML('beforeend',
                    '<div class="modal-banner" style="background-color: var(--reservada);"><span class="banner-linia1">RESERVADA</span></div>');
            }
        }

        function carregarDadesModal() {
            const moto = motos[motoActualIndex];
            restablirBotoEliminar(); // si estava demanant confirmació, torna a l'estat normal

            document.getElementById('camp-id').value = moto.id;
            for (const [idCamp, propietat] of Object.entries(CAMPS)) {
                document.getElementById(idCamp).value = moto[propietat] ?? '';
            }

            // Estat: venuda > reservada > en venda
            const estat = moto.venuda ? 'venuda' : (moto.reservada ? 'reservada' : 'venda');
            document.querySelector(`input[name="estat"][value="${estat}"]`).checked = true;

            // Foto principal i les 5 miniatures
            const imgGran = document.getElementById('modal-img-gran');
            imgGran.src = `${CONFIG.ASSETS_OCA}${moto.fotos[0]}`;

            const contMiniatures = document.getElementById('modal-miniatures');
            contMiniatures.innerHTML = '';
            moto.fotos.forEach((foto, idx) => {
                const img = document.createElement('img');
                const ruta = `${CONFIG.ASSETS_OCA}${foto}`;
                img.src = ruta;
                img.alt = `Foto ${idx + 1}`;
                if (idx === 0) img.classList.add('activa');
                img.onclick = () => {
                    imgGran.src = ruta;
                    contMiniatures.querySelectorAll('img').forEach(i => i.classList.remove('activa'));
                    img.classList.add('activa');
                };
                contMiniatures.appendChild(img);
            });

            pintarBannerModal();
            actualitzarPendents();
        }

        /* ─── CANVIS PENDENTS: DETECTAR I MARCAR ───────────────── */
        // Camps editables d'una moto: els de text + l'estat
        const PROPIETATS_EDITABLES = [...Object.values(CAMPS), 'estat'];

        // Valor d'un camp en forma de text (l'estat es calcula a partir de venuda/reservada)
        function valorCamp(moto, propietat) {
            if (propietat === 'estat') return moto.venuda ? 'venuda' : (moto.reservada ? 'reservada' : 'venda');
            return String(moto[propietat] ?? '');
        }

        // Camps d'una moto que són diferents dels guardats
        function campsCanviats(moto) {
            const original = originals[moto.id];
            return PROPIETATS_EDITABLES.filter(p => valorCamp(moto, p) !== valorCamp(original, p));
        }

        // Total de pendents: camps tocats de totes les motos + motos eliminades (1 cada una)
        function totalPendents() {
            return motos.reduce((total, moto) => total + campsCanviats(moto).length, 0) + eliminades.length;
        }

        // Marca en vermell els camps tocats de la moto oberta i actualitza el botó Guardar
        function actualitzarPendents() {
            const motoOberta = motos[motoActualIndex];
            const canviats = motoOberta ? campsCanviats(motoOberta) : [];
            for (const [idCamp, propietat] of Object.entries(CAMPS)) {
                document.getElementById(idCamp).classList.toggle('camp--canviat', canviats.includes(propietat));
            }
            document.querySelector('.modal-estats').classList.toggle('modal-estats--canviat', canviats.includes('estat'));

            const total = totalPendents();
            const boto = document.getElementById('btn-guardar');
            boto.disabled = (total === 0);
            boto.classList.toggle('btn-guardar--pendent', total > 0);
            boto.textContent = total > 0 ? `Pendientes (${total})` : 'Guardar';
        }

        function mostrarMissatge(text) {
            document.getElementById('modal-missatge').textContent = text;
        }

        // Cada tecla escrita actualitza la moto oberta
        for (const [idCamp, propietat] of Object.entries(CAMPS)) {
            document.getElementById(idCamp).addEventListener('input', (e) => {
                motos[motoActualIndex][propietat] = e.target.value;
                mostrarMissatge('');
                actualitzarPendents();
            });
        }

        // Els radios d'estat marquen venuda / reservada (només un alhora)
        document.querySelectorAll('input[name="estat"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                const moto = motos[motoActualIndex];
                moto.venuda    = (e.target.value === 'venuda');
                moto.reservada = (e.target.value === 'reservada');
                pintarBannerModal();
                mostrarMissatge('');
                actualitzarPendents();
            });
        });

        /* ─── BOTONS: NOVA MOTO I GUARDAR ──────────────────────── */
        // Següent ID, p. ex. id0004: puja el contador, així una ID eliminada no es torna a usar
        function nouIdMoto() {
            contadorId += 1;
            return 'id' + String(contadorId).padStart(4, '0');
        }

        document.getElementById('btn-nova').addEventListener('click', () => {
            const id = nouIdMoto();
            const motoNova = {
                id: id, marca: '', model: '', preu: '', cc: '', kw: '', any: '', km: '',
                descripcio: '',
                // Fotos buides: s'omplen amb el placeholder fins que es pugin pujar
                fotos: [1, 2, 3, 4, 5].map(n => 'id9999/Default.png'),
                venuda: false, reservada: false
            };
            motos.push(motoNova);
            // L'original d'una moto nova és ella mateixa en blanc: només compten els camps que s'omplin
            originals[id] = JSON.parse(JSON.stringify(motoNova));
            obrirModalMoto(motos.length - 1);
            mostrarMissatge('Moto nueva creada. Rellena los campos y pulsa Guardar.');
        });

        // Envia l'array complet al Worker amb la clau d'admin
        async function desarMotos() {
            const boto = document.getElementById('btn-guardar');
            boto.disabled = true;
            boto.textContent = 'Guardando...';

            // Una moto nova encara en blanc (sense cap camp omplert) no es guarda
            const aGuardar = motos.filter(m => motosGuardades.has(m.id) || campsCanviats(m).length > 0);
            const dades = targetaFixa ? [...aGuardar, targetaFixa] : [...aGuardar];

            try {
                const res = await fetch(`${CONFIG.BASE_WORKER}/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Admin-Key': clauAdmin },
                    body: JSON.stringify(dades)
                });

                if (res.status === 401) {
                    // La clau ja no és vàlida: cal tornar a entrar pel login
                    sessionStorage.removeItem('admin_clau');
                    mostrarMissatge('Clave no válida. Recarga la página y vuelve a entrar.');
                } else if (!res.ok) {
                    mostrarMissatge('Error del servidor: no se ha guardado.');
                } else {
                    // Guardat: l'estat actual passa a ser el de referència (ja no hi ha pendents)
                    motos = aGuardar;
                    originals = {};
                    motos.forEach(m => { originals[m.id] = JSON.parse(JSON.stringify(m)); });
                    motosGuardades = new Set(motos.map(m => m.id));
                    eliminades = [];
                    pintarGraella();
                    mostrarMissatge('✔ Guardado correctamente.');
                }
            } catch (e) {
                mostrarMissatge('Error de conexión: no se ha guardado.');
            }

            // Si hi havia una moto oberta que s'ha descartat per estar en blanc, es tanca el modal
            if (motoActualIndex >= motos.length) tancarModalMoto();
            actualitzarPendents();
        }

        document.getElementById('btn-guardar').addEventListener('click', desarMotos);

        /* ─── ELIMINAR MOTO (cal confirmar amb un segon clic) ─── */
        let temporitzadorEliminar;

        // Torna el botó Eliminar a l'estat normal
        function restablirBotoEliminar() {
            clearTimeout(temporitzadorEliminar);
            const boto = document.getElementById('btn-eliminar');
            boto.classList.remove('btn-eliminar--confirmar');
            boto.textContent = 'Eliminar moto';
        }

        // Treu la moto oberta; si ja estava guardada, queda com a canvi pendent
        function eliminarMotoActual() {
            const [moto] = motos.splice(motoActualIndex, 1);
            if (motosGuardades.has(moto.id)) {
                eliminades.push(moto.id);
            } else {
                delete originals[moto.id]; // moto nova que mai s'havia guardat: no deixa res pendent
            }
            tancarModalMoto();
            actualitzarPendents();
        }

        document.getElementById('btn-eliminar').addEventListener('click', (e) => {
            const boto = e.currentTarget;
            if (boto.classList.contains('btn-eliminar--confirmar')) {
                restablirBotoEliminar();
                eliminarMotoActual();
                return;
            }
            // Primer clic: demana confirmació durant 4 segons
            boto.classList.add('btn-eliminar--confirmar');
            boto.textContent = '¿Seguro? Pulsa de nuevo';
            temporitzadorEliminar = setTimeout(restablirBotoEliminar, 4000);
        });

        /* ─── INICI ────────────────────────────────────────────── */
        async function iniciar() {
            // Sense clau no es mostra res: surt el modal de login (i en entrar torna aquí)
            if (!clauAdmin) {
                obrirModalLogin();
                return;
            }
            try {
                await carregarMotos();
                pintarGraella();
                if (motos.length === 0) mostrarEstatPagina('Todavía no hay motos.');
            } catch (e) {
                mostrarEstatPagina('No se han podido cargar las motos. Recarga la página.');
            }
        }

        // Missatge sota el títol (errors de càrrega, llista buida)
        function mostrarEstatPagina(text) {
            document.getElementById('admin-estat').textContent = text;
        }

        iniciar();
    </script>

</body>
</html>
